name: Release modpack

on:
  push:
    tags:
      - '**'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  export:
    # Skip private repositories to avoid runner charges.
    if: github.event.repository.visibility == 'public' && github.event.created
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install mise and packwiz
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          cache: false

      - name: Export mrpack
        env:
          MRPACK: ${{ runner.temp }}/Fortnight.mrpack
        run: >-
          mise exec -- packwiz modrinth export
          --output "$MRPACK"
          --cache "${{ runner.temp }}/packwiz-cache"
          --yes

      - name: Publish release
        env:
          MRPACK: ${{ runner.temp }}/Fortnight.mrpack
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" "$MRPACK" --clobber
